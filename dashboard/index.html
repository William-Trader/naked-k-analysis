<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PA Terminal · 价格行为 AI 交易面板</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">PA</div>
      <div class="brand-txt">
        <b>价格行为终端</b>
        <span>PRICE ACTION · AI TRADING DESK</span>
      </div>
    </div>

    <div class="sym-rail" id="sym-rail"></div>
    <button class="icon-btn" id="btn-universe" title="标的池">＋</button>

    <div class="tf-rail" id="tf-rail"></div>

    <div class="top-right">
      <div class="live" id="live"><i></i><span>连接中</span></div>
      <div class="clock" id="clock">--:--:--</div>
      <button class="icon-btn" id="btn-settings" title="系统设置">⚙</button>
    </div>
  </header>

  <main class="workspace">
    <section class="chart-pane">
      <div class="chart-head">
        <div class="instrument">
          <h1 id="sym-title">BTC/USDT</h1>
          <span class="market-tag" id="market-tag">加密货币</span>
        </div>
        <div class="quote">
          <b id="last-price">—</b>
          <i id="last-chg">—</i>
        </div>
        <div class="chart-flags" id="chart-flags">
          <label><input type="checkbox" data-layer="structure" checked><span>结构</span></label>
          <label><input type="checkbox" data-layer="patterns" checked><span>形态</span></label>
          <label><input type="checkbox" data-layer="zones" checked><span>供需</span></label>
          <label><input type="checkbox" data-layer="plan" checked><span>计划</span></label>
        </div>
        <div class="chart-tools">
          <button class="ghost-btn" id="btn-refit">适配</button>
          <button class="ghost-btn" id="btn-reanalyze">重新分析</button>
        </div>
      </div>

      <div class="chart-wrap" id="chart-wrap">
        <div id="chart"></div>
        <canvas id="overlay"></canvas>
        <div class="drawbar" id="drawbar">
          <button data-draw-tool="cursor" class="on" title="光标 / 缩放">✥</button>
          <button data-draw-tool="select" title="选择 / 拖动">↖</button>
          <button data-draw-tool="trend" title="趋势线">╱</button>
          <button data-draw-tool="ray" title="射线">↗</button>
          <button data-draw-tool="hline" title="水平线">─</button>
          <button data-draw-tool="rect" title="矩形">▭</button>
          <button data-draw-tool="fib" title="斐波那契">ƒ</button>
          <button data-draw-tool="text" title="文字">T</button>
          <button data-draw-tool="measure" title="测量">⇔</button>
          <button data-draw-tool="arrow" title="箭头">→</button>
          <button data-draw-tool="brush" title="画笔">✎</button>
          <button data-draw-tool="eraser" title="擦除">⌫</button>
          <span class="drawsep"></span>
          <button data-draw-tool="magnet" title="磁吸 OHLC">🧲</button>
          <button data-draw-tool="lock" title="锁定绘图">🔒</button>
          <input id="draw-color" type="color" value="#e0b968" title="颜色">
          <select id="draw-width" title="线宽">
            <option value="1">1</option><option value="1.6" selected>2</option>
            <option value="2.4">3</option><option value="3.2">4</option>
          </select>
          <span class="drawsep"></span>
          <button data-draw-tool="undo" title="撤销 Ctrl+Z">↶</button>
          <button data-draw-tool="redo" title="重做">↷</button>
          <button data-draw-tool="clear" title="清空">✕</button>
        </div>
        <div class="ohlc" id="ohlc">—</div>
        <div class="chart-empty" id="chart-empty" hidden>数据加载中…</div>
      </div>

      <div class="chart-foot">
        <div class="legend">
          <span><i class="dot up"></i>EMA20</span>
          <span><i class="dot mid"></i>EMA50</span>
          <span><i class="dot zone"></i>供需区</span>
          <span><i class="dot plan"></i>计划</span>
        </div>
        <div class="freshness" id="freshness">数据源 — · —</div>
      </div>
    </section>

    <aside class="side-pane">
      <div class="side-head">
        <div class="side-title">分析面板</div>
        <div class="side-sub" id="side-sub">4H + 15M 联合</div>
      </div>
      <div class="side-scroll" id="side-scroll">
        <div class="skeleton-card">正在建立分析…</div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" hidden></div>

  <footer class="statusbar">
    <span id="st-engine">引擎 —</span>
    <span id="st-symbols">标的 —</span>
    <span id="st-plan">计划 —</span>
    <span class="spacer"></span>
    <span id="st-llm">LLM —</span>
    <span class="disclaimer">分析工具，不构成投资建议</span>
  </footer>
</div>

<div class="modal" id="settings-modal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-card wide">
    <div class="modal-head">
      <div><b>系统设置</b><span>标的池 / 分析周期 / 自动化 / 参数库</span></div>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="modal-body" id="settings-body"></div>
    <div class="modal-foot">
      <button class="ghost-btn" data-close>关闭</button>
      <button class="primary-btn" id="btn-save-settings">保存并应用</button>
    </div>
  </div>
</div>

<div class="modal" id="universe-modal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <div><b>选择标的</b><span>默认 BTC / ETH；其他标的按需接入</span></div>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="modal-body">
      <input class="search" id="universe-search" placeholder="搜索代码 / 名称 / 市场">
      <div class="universe-list" id="universe-list"></div>
    </div>
    <div class="modal-foot">
      <span class="muted" id="universe-count">已选 0 / 6</span>
      <button class="ghost-btn" data-close>关闭</button>
      <button class="primary-btn" id="btn-apply-universe">应用</button>
    </div>
  </div>
</div>

<script src="/vendor/lwc.js"></script>
<script type="module" src="/app/main.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAKED-K · 价格行为终端</title>
<style>
:root{--bg:#070b12;--panel:#0d1420;--line:#1c2a3d;--text:#e8eef8;--muted:#8b9bb4;--gold:#d9b45b;--up:#ff5b6e;--down:#35d07f;--amber:#f0b35b;--blue:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#122033 0,#070b12 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{max-width:1320px;margin:0 auto;padding:20px 22px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:20px;letter-spacing:.16em;font-weight:700}
.brand span{color:var(--gold)}
.sub{color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.08em}
.hright{display:flex;align-items:center;gap:10px}
.tf{display:flex;gap:4px;background:#0a111c;border:1px solid var(--line);border-radius:10px;padding:3px}
.tf button{background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer}
.tf button.on{background:var(--gold);color:#0a111c}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 12px var(--down)}
nav.tabs{max-width:1320px;margin:16px auto 0;padding:0 22px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.04em}
nav.tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
main{max-width:1320px;margin:0 auto;padding:16px 22px 30px}
section.tab{display:none}
section.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:linear-gradient(180deg,#0f1826,#0b121d);border:1px solid var(--line);border-radius:16px;padding:16px 16px 10px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sym{font-size:20px;font-weight:700;letter-spacing:.06em}
.price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.chg{font-size:13px;font-weight:600;margin-top:2px}
.muted{color:var(--muted)}
.gauge{margin-top:12px}
.gauge-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{height:9px;border-radius:99px;background:#0a111c;border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--down),var(--gold),var(--up));border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.stat{background:#0a111c;border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center}
.stat b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.stat i{display:block;font-style:normal;color:var(--muted);font-size:10px;margin-top:2px}
.levels{margin-top:10px;font-size:12px;line-height:1.7}
.levels b{color:var(--gold);font-weight:600}
.sig{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px;line-height:1.7}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;margin:2px 4px 0 0}
.chart-wrap{position:relative;margin-top:8px}
.tv-chart{width:100%;height:360px;border-radius:8px;overflow:hidden}
.events{max-width:1320px;margin:18px auto 0;padding:0 22px}
.events h2{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:0 0 10px}
.ev{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#0a111c;font-size:12px}
.ev .sev{font-weight:700;font-size:11px}
.ev .t{color:var(--muted);font-variant-numeric:tabular-nums}
footer{max-width:1320px;margin:0 auto;padding:18px 22px 40px;color:var(--muted);font-size:11px;line-height:1.7}
.kb{display:grid;grid-template-columns:280px 1fr;gap:16px}
.kb-nav{background:linear-gradient(180deg,#0f1826,#0b121d);border:1px solid var(--line);border-radius:14px;padding:12px;align-self:start;max-height:78vh;overflow:auto;position:sticky;top:12px}
.kb-nav h3{font-size:12px;letter-spacing:.12em;color:var(--gold);margin:0 0 8px}
.kb-nav .mi{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);font-size:12px;padding:7px 9px;border-radius:7px;cursor:pointer;line-height:1.4}
.kb-nav .mi:hover{background:#0a111c}
.kb-nav .mi.on{background:#0a111c;color:var(--gold)}
.kb-doc{background:linear-gradient(180deg,#0f1826,#0b121d);border:1px solid var(--line);border-radius:14px;padding:22px 26px;font-size:14px;line-height:1.8;overflow:auto;max-height:82vh}
.kb-doc h1{font-size:22px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:10px}
.kb-doc h2{font-size:17px;color:var(--text);margin-top:24px;border-left:3px solid var(--gold);padding-left:10px}
.kb-doc h3{font-size:15px;color:var(--text);margin-top:18px}
.kb-doc table{border-collapse:collapse;width:100%;margin:12px 0;font-size:12.5px}
.kb-doc th,.kb-doc td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.kb-doc th{background:#0a111c;color:var(--gold)}
.kb-doc code{background:#0a111c;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px;color:var(--blue)}
.kb-doc pre{background:#0a111c;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}
.kb-doc pre code{border:0;padding:0}
.kb-doc blockquote{border-left:3px solid var(--gold);margin:10px 0;padding:6px 14px;color:var(--muted);background:#0a111c;border-radius:0 8px 8px 0}
.kb-doc ul,.kb-doc ol{padding-left:22px}
.kb-doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.params{max-width:720px}
.pgroup{background:linear-gradient(180deg,#0f1826,#0b121d);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.pgroup h3{font-size:13px;letter-spacing:.08em;color:var(--gold);margin:0 0 12px}
.prow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prow label{flex:0 0 200px;font-size:12px;color:var(--muted)}
.prow input[type=range]{flex:1}
.prow .pv{flex:0 0 64px;font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.prow input[type=number]{width:88px;background:#0a111c;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font-size:13px}
.pactions{display:flex;gap:10px;margin-top:6px}
.pactions button{background:var(--gold);border:0;color:#0a111c;font-weight:700;font-size:13px;padding:9px 18px;border-radius:9px;cursor:pointer}
.pactions button.ghost{background:#0a111c;color:var(--muted);border:1px solid var(--line)}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6}
@media(max-width:900px){.grid{grid-template-columns:1fr}.kb{grid-template-columns:1fr}.kb-nav{position:static;max-height:none}}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">NAKED<span>-K</span> · 价格行为终端</div>
    <div class="sub">PRICE ACTION TERMINAL · TRADINGVIEW CHART · CANDLES · PATTERNS · KNOWLEDGE</div>
  </div>
  <div class="hright">
    <div class="tf" id="tf">
      <button data-tf="1h">1H</button><button data-tf="4h" class="on">4H</button><button data-tf="1d">1D</button>
    </div>
    <div class="live"><span class="dot"></span><span id="asof">加载中…</span></div>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="market" class="on">行情</button>
  <button data-tab="knowledge">知识库</button>
  <button data-tab="params">调参</button>
</nav>
<main>
  <section class="tab on" id="tab-market">
    <div class="grid" id="grid"></div>
    <div class="events"><h2>EVENT FEED · 1M/5M</h2><div id="events"></div></div>
  </section>
  <section class="tab" id="tab-knowledge">
    <div class="kb">
      <div class="kb-nav" id="kb-nav"><h3>知识体系</h3><div id="kb-list">加载中…</div></div>
      <div class="kb-doc" id="kb-doc"><div class="muted">从左侧选择一个模块阅读。</div></div>
    </div>
  </section>
  <section class="tab" id="tab-params">
    <div class="params" id="params-panel"></div>
  </section>
</main>
<footer>分析工具，不构成投资建议。形态为规则候选，需结合上下文确认。图表由 TradingView Lightweight Charts™ 渲染。</footer>
<script src="/vendor/lwc.js"></script>
<script>
var TF='4h', DATA=null, CHARTS={};
var C={up:'#ff5b6e',down:'#35d07f',neutral:'#8b9bb4',gold:'#d9b45b',blue:'#5aa9ff',amber:'#f0b35b'};
var CB=String.fromCharCode(96); var NL=String.fromCharCode(10);
function fmt(n,d){ if(n===null||n===undefined) return '—'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||2,maximumFractionDigits:d||2}); }
function pct(n){ return (n>=0?'+':'')+Number(n).toFixed(2)+'%'; }
function col(n){ return n>=0?C.up:C.down; }
function makeChart(sym, s){
  var el=document.getElementById('chart-'+sym); if(!el) return;
  if(CHARTS[sym]){ try{CHARTS[sym].chart.remove();}catch(e){} }
  if(!window.LightweightCharts){ el.textContent='图表库未加载'; return; }
  var chart=LightweightCharts.createChart(el,{
    layout:{background:{color:'transparent'},textColor:'#8b9bb4',fontFamily:'Inter,system-ui'},
    grid:{vertLines:{color:'#162335'},horzLines:{color:'#162335'}},
    rightPriceScale:{borderColor:'#1c2a3d'},
    timeScale:{borderColor:'#1c2a3d',timeVisible:true,secondsVisible:false},
    crosshair:{mode:0},
  });
  var candles=chart.addCandlestickSeries({
    upColor:'#ff5b6e',downColor:'#35d07f',borderVisible:false,
    wickUpColor:'#ff5b6e',wickDownColor:'#35d07f',
  });
  candles.setData((s.candles||[]).map(function(k){ return {time:k.t/1000,open:k.o,high:k.h,low:k.l,close:k.c}; }));
  function addLine(vals,color){
    var ln=chart.addLineSeries({color:color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    var d=[];(vals||[]).forEach(function(v,i){ if(v===undefined||v===null)return; d.push({time:s.candles[i].t/1000,value:v}); });
    ln.setData(d);
  }
  addLine(s.ema20_series,C.gold); addLine(s.ema50_series,C.blue);
  function hline(p,color,label){ if(p===null||p===undefined)return; candles.createPriceLine({price:p,color:color,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:label}); }
  hline(s.r20_lo,C.down,'支撑'); hline(s.r20_hi,C.up,'阻力');
  function marks(arr,dir){
    var out=[];(arr||[]).forEach(function(pt){ if(pt.i>=0&&pt.i<s.candles.length){ out.push({time:s.candles[pt.i].t/1000,position:dir,color:dir==='aboveBar'?C.down:C.up,shape:dir==='aboveBar'?'arrowDown':'arrowUp',text:dir==='aboveBar'?'SH':'SL'}); } });
    return out;
  }
  candles.setMarkers(marks(s.swing_marks&&s.swing_marks.highs,'aboveBar').concat(marks(s.swing_marks&&s.swing_marks.lows,'belowBar')));
  var pm=[];(s.patterns||[]).forEach(function(pt){ if(pt.role==='suppressed')return; if(pt.index!=null&&pt.index>=0&&pt.index<s.candles.length){ var pos=pt.direction==='bullish'?'belowBar':pt.direction==='bearish'?'aboveBar':'belowBar'; pm.push({time:s.candles[pt.index].t/1000,position:pos,color:pt.direction==='bullish'?C.down:pt.direction==='bearish'?C.up:C.gold,shape:'circle',text:pt.type}); } });
  candles.setMarkers(pm);
  chart.timeScale().fitContent();
  CHARTS[sym]={chart:chart};
}
function card(sym,s){
  var tr=s.trend||{},st=s.stance||{},dir=st.direction||'neutral';
  var mtf=s.mtf||{},sv=s.structure_v2||{},bp=s.bar||{},sb=s.signalbar||{};
  var mtfTxt='MTF '+(mtf.alignment==null?'—':(mtf.alignment>0?'+'+mtf.alignment:String(mtf.alignment)))+' '+(mtf.label||'—');
  var stTxt='结构 '+(sv.state||'—')+((sv.bos&&sv.bos.kind)?' · BOS '+sv.bos.kind:'')+((sv.choch&&sv.choch.kind)?' · CHoCH '+sv.choch.kind:'');
  var barTxt='BAR '+(bp.type||'—')+' q'+(bp.quality==null?'—':bp.quality);
  var sbTxt=(sb.score==null)?'':' · 信号K '+sb.score;
  var sc=tr.score||50,label=tr.label||'neutral',ai=tr.always_in||'neutral';
  function pstate(t,d){var a=s.pattern_states||[];for(var i=0;i<a.length;i++){if(a[i].type===t&&a[i].direction===d)return a[i].status;}return '';}
  var prim=s.primary_pattern,sec=s.secondary_pattern;var pats='';
  if(prim){var c=prim.direction==='bullish'?C.up:prim.direction==='bearish'?C.down:C.gold;var pst=pstate(prim.type,prim.direction);pats+='<span class="pill" style="color:'+c+';border:1px solid '+c+'">主：'+prim.label+' · '+prim.quality+(pst?' · '+pst:'')+'</span>';}
  if(sec){var c2=sec.direction==='bullish'?C.up:sec.direction==='bearish'?C.down:C.gold;var sst=pstate(sec.type,sec.direction);pats+='<span class="pill" style="color:'+c2+';border:1px solid '+c2+'">备：'+sec.label+' · '+sec.quality+(sst?' · '+sst:'')+'</span>';}
  var sup=(s.patterns||[]).filter(function(x){return x.role==='suppressed';}).length;
  if(!prim)pats='<span class="muted" style="font-size:11px">无标准形态</span>';
  pats+='<span class="muted" style="font-size:10px"> · 上下文 '+(s.pattern_context||'—')+' · 过滤 '+sup+' 个</span>';
  var sig='方向 <span class="pill" style="color:'+C[dir]+';border:1px solid '+C[dir]+'">'+dir+'</span> · 置信度 <b>'+(st.confidence||'—')+'</b>';
  if(st.entry)sig+=' · entry <b>'+fmt(st.entry,1)+'</b> · stop <b>'+fmt(st.stop,1)+'</b> · target <b>'+fmt(st.target,1)+'</b>';
  return '<article class="card">'
    +'<div class="card-top"><div><div class="sym">'+sym.replace('USDT','')+'<span class="muted" style="font-size:12px">/USDT</span></div>'
    +'<div class="price">'+fmt(s.price,2)+'</div>'
    +'<div class="chg" style="color:'+col(s.change24h)+'">'+pct(s.change24h)+' · 24h 高/低 '+fmt(s.high24h,1)+' / '+fmt(s.low24h,1)+'</div></div>'
    +'<div style="text-align:right"><div class="muted" style="font-size:11px">TREND SCORE</div>'
    +'<div style="font-size:26px;font-weight:700;color:'+(sc>=60?C.up:sc<=40?C.down:C.neutral)+'">'+sc+'</div>'
    +'<div class="muted" style="font-size:11px">'+label+'</div></div></div>'
    +'<div class="gauge"><div class="gauge-head"><span>Always-In: <b style="color:'+C[ai]+'">'+ai+'</b></span><span>0 — 100</span></div><div class="bar"><div class="fill" style="width:'+sc+'%"></div></div></div>'
    +'<div class="stats"><div class="stat"><b>'+fmt(s.adx,1)+'</b><i>ADX</i></div><div class="stat"><b>'+fmt(s.rsi,1)+'</b><i>RSI</i></div><div class="stat"><b>'+fmt(s.atr_pct,2)+'%</b><i>ATR</i></div><div class="stat"><b>'+fmt(s.vol_z,2)+'</b><i>VOL Z</i></div><div class="stat"><b>'+Math.round((s.pos20||0)*100)+'%</b><i>POS20</i></div></div>'
    +'<div class="levels">支撑 <b>'+fmt(s.r20_lo,1)+'</b> / '+fmt((s.swing_lows||[]).slice(-1)[0]||s.low24h,1)+' · 阻力 <b>'+fmt(s.r20_hi,1)+'</b> / '+fmt((s.swing_highs||[]).slice(-1)[0]||s.high24h,1)+'</div>'
    +'<div class="levels">'+mtfTxt+' · '+stTxt+' · '+barTxt+sbTxt+'</div>'
    +'<div class="sig">'+sig+'</div>'
    +'<div style="margin-top:7px;font-size:11px;color:var(--muted)">结构：'+(s.structure||'—')+' · 形态：'+pats+'</div>'
    +'<div class="chart-wrap"><div class="tv-chart" id="chart-'+sym+'"></div></div>'
    +'</article>';
}
function render(){
  if(!DATA)return;
  var g=document.getElementById('grid');var keys=Object.keys(DATA.symbols||{});
  g.innerHTML=keys.map(function(k){return card(k,DATA.symbols[k]);}).join('');
  keys.forEach(function(sym){ makeChart(sym,DATA.symbols[sym]); });
  var first=keys[0];var dts=first?DATA.symbols[first].data_ts:DATA.as_of;
  document.getElementById('asof').textContent='数据 '+new Date(dts).toLocaleString('zh-CN',{hour12:false})+' · Binance · '+TF;
  var ev=document.getElementById('events');
  ev.innerHTML=(DATA.events||[]).slice(0,30).map(function(e){
    var t=new Date(e.ts).toLocaleString('zh-CN',{hour12:false});
    var c=e.severity==='P0'?C.up:e.severity==='P1'?C.amber:C.muted;
    return '<div class="ev"><span class="sev" style="color:'+c+'">'+e.severity+'</span><span class="t">'+t+'</span><span>'+e.symbol+' · '+e.kind+'</span><span class="muted">'+fmt(e.price,1)+'</span></div>';
  }).join('')||'<div class="ev muted">暂无事件</div>';
}
async function load(tf){
  TF=tf;document.querySelectorAll('#tf button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tf')===tf);});
  try{var r=await fetch('/api/overview?interval='+tf);DATA=await r.json();render();}
  catch(e){document.getElementById('asof').textContent='数据源异常';}
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mdToHtml(src){
  var lines=src.split(NL),out=[],inCode=false,codeBuf=[],tbl=[],inTable=false;
  function flushTable(){
    if(!tbl.length)return;
    var html='<table>';var rows=tbl.map(function(r){return r.split('|').slice(1,-1).map(function(c){return c.trim();});});
    rows.forEach(function(r,i){ var tag=i===0?'th':'td'; html+='<tr>'+r.map(function(c){return '<'+tag+'>'+inline(c)+'</'+tag+'>';}).join('')+'</tr>'; });
    html+='</table>';out.push(html);tbl=[];inTable=false;
  }
  function inline(s){
    s=esc(s);
    s=s.replace(new RegExp(CB+'([^'+CB+']+)'+CB,'g'),'<code>$1</code>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    return s;
  }
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(ln.trim().startsWith(CB+CB+CB)){ if(inCode){out.push('<pre><code>'+esc(codeBuf.join(NL))+'</code></pre>');codeBuf=[];} inCode=!inCode; continue; }
    if(inCode){codeBuf.push(ln);continue;}
    if(ln.trim().startsWith('|')&&ln.trim().endsWith('|')){ if(!inTable)tbl=[]; tbl.push(ln); inTable=true; if(i===lines.length-1)flushTable(); continue; }
    else if(inTable){ flushTable(); }
    if(/^#{1,4}\s/.test(ln)){ var h=ln.match(/^(#{1,4})\s(.*)/); var lv=h[1].length; out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>'); continue; }
    if(/^\s*[-*]\s/.test(ln)){ out.push('<li>'+inline(ln.replace(/^\s*[-*]\s/,''))+'</li>'); continue; }
    if(/^\s*\d+\.\s/.test(ln)){ out.push('<li>'+inline(ln.replace(/^\s*\d+\.\s/,''))+'</li>'); continue; }
    if(ln.trim().startsWith('>')){ out.push('<blockquote>'+inline(ln.replace(/^\s*>\s?/,''))+'</blockquote>'); continue; }
    if(/^---+$/.test(ln.trim())){ out.push('<hr>'); continue; }
    if(ln.trim()==='')continue;
    out.push('<p>'+inline(ln)+'</p>');
  }
  return out.join(NL);
}
async function loadKbList(){
  try{
    var r=await fetch('/api/knowledge');var d=await r.json();
    var list=document.getElementById('kb-list');
    if(!d.modules){list.textContent='加载失败';return;}
    list.innerHTML=d.modules.map(function(m){
      return '<button class="mi" data-file="'+m.file+'"><b>'+esc(m.file.replace('.md',''))+'</b><br>'+esc(m.title)+'</button>';
    }).join('');
    list.querySelectorAll('.mi').forEach(function(b){
      b.addEventListener('click',function(){
        list.querySelectorAll('.mi').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on');loadKbDoc(b.getAttribute('data-file'));
      });
    });
  }catch(e){document.getElementById('kb-list').textContent='加载失败';}
}
async function loadKbDoc(file){
  try{
    var r=await fetch('/api/knowledge?file='+encodeURIComponent(file));var d=await r.json();
    var doc=document.getElementById('kb-doc');
    if(d.error){doc.innerHTML='<div class="muted">'+esc(d.error)+'</div>';return;}
    doc.innerHTML=mdToHtml(d.content);
    doc.scrollTop=0;
  }catch(e){document.getElementById('kb-doc').innerHTML='<div class="muted">加载失败</div>';}
}
var PARAM_META=[
  {g:'方向判定（stance）',keys:[
    ['stance_adx_trend','ADX 趋势门槛',0,60,1],
    ['stance_pos_short','禁止做空位置下限',0,0.5,0.02],
    ['stance_pos_long','禁止做多位置上限',0.5,1,0.02],
    ['stance_stop_atr','止损 ATR 倍数',0.5,4,0.1],
    ['stance_target_atr','目标 ATR 倍数',1,6,0.1],
  ]},
  {g:'趋势标签（trend）',keys:[
    ['trend_adx_trend','趋势评分 ADX 门槛',0,60,1],
    ['trend_label_up','看多阈值',50,90,1],
    ['trend_label_down','看空阈值',10,50,1],
    ['trend_label_strong_up','强多阈值',60,95,1],
    ['trend_label_strong_down','强空阈值',5,40,1],
  ]},
  {g:'信号K（signal bar）',keys:[
    ['signalbar_min_quality','最低信号K质量',0,100,1],
  ]},
];
function loadParams(){
  fetch('/api/params').then(function(r){return r.json();}).then(function(p){renderParams(p);}).catch(function(){});
}
function renderParams(p){
  var panel=document.getElementById('params-panel');
  var html='';
  PARAM_META.forEach(function(g){
    html+='<div class="pgroup"><h3>'+g.g+'</h3>';
    g.keys.forEach(function(k){
      var key=k[0],lab=k[1],lo=k[2],hi=k[3],step=k[4],val=p[key];
      html+='<div class="prow"><label>'+lab+'</label>'
        +'<input type="range" min="'+lo+'" max="'+hi+'" step="'+step+'" value="'+val+'" data-key="'+key+'">'
        +'<input type="number" value="'+val+'" data-num="'+key+'" step="'+step+'">'
        +'<span class="pv" data-val="'+key+'">'+val+'</span></div>';
    });
    html+='</div>';
  });
  html+='<div class="pactions"><button id="save-params">保存并应用</button><button class="ghost" id="reset-params">恢复默认</button></div>'
    +'<div class="note">调参即时生效于 stance / trend 判定与信号K质量门槛。保存后写入 state/params.json，重启后仍生效。默认值即历史行为。</div>';
  panel.innerHTML=html;
  panel.querySelectorAll('input[type=range]').forEach(function(s){
    s.addEventListener('input',function(){
      var key=s.getAttribute('data-key');var v=parseFloat(s.value);
      var nv=panel.querySelector('input[data-num="'+key+'"]');if(nv)nv.value=v;
      var sp=panel.querySelector('span[data-val="'+key+'"]');if(sp)sp.textContent=v;
    });
  });
  panel.querySelectorAll('input[type=number]').forEach(function(n){
    n.addEventListener('change',function(){
      var key=n.getAttribute('data-num');var v=parseFloat(n.value);if(isNaN(v))return;
      var sl=panel.querySelector('input[data-key="'+key+'"]');if(sl){sl.value=v;}
      var sp=panel.querySelector('span[data-val="'+key+'"]');if(sp)sp.textContent=v;
    });
  });
  document.getElementById('save-params').addEventListener('click',function(){
    var payload={};
    panel.querySelectorAll('input[data-key]').forEach(function(s){payload[s.getAttribute('data-key')]=parseFloat(s.value);});
    fetch('/api/params',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(){load(TF);}).catch(function(){});
  });
  document.getElementById('reset-params').addEventListener('click',function(){
    fetch('/api/params',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).then(function(){load(TF);}).catch(function(){});
  });
}
document.querySelectorAll('#tabs button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on');});
    document.querySelectorAll('section.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    document.getElementById('tab-'+b.getAttribute('data-tab')).classList.add('on');
    if(b.getAttribute('data-tab')==='knowledge'&&!window._kbLoaded){window._kbLoaded=true;loadKbList();}
    if(b.getAttribute('data-tab')==='params')loadParams();
  });
});
document.querySelectorAll('#tf button').forEach(function(b){b.addEventListener('click',function(){load(b.getAttribute('data-tf'));});});
window.addEventListener('resize',function(){ Object.keys(CHARTS).forEach(function(k){try{CHARTS[k].chart.applyOptions({width:document.getElementById('chart-'+k).clientWidth});}catch(e){}}); });
load('4h');
setInterval(function(){ if(!document.hidden) load(TF); },60000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) load(TF); });
</script>

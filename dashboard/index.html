<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAKED-K · 价格行为终端</title>
<style>
:root{--bg:#070b12;--panel:#0d1420;--line:#1c2a3d;--text:#e8eef8;--muted:#8b9bb4;--gold:#d9b45b;--up:#ff5b6e;--down:#35d07f;--amber:#f0b35b;--blue:#5aa9ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#122033 0,#070b12 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{max-width:1240px;margin:0 auto;padding:26px 22px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:22px;letter-spacing:.18em;font-weight:700}
.brand span{color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:6px;letter-spacing:.08em}
.hright{display:flex;align-items:center;gap:10px}
.tf{display:flex;gap:4px;background:#0a111c;border:1px solid var(--line);border-radius:10px;padding:3px}
.tf button{background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer}
.tf button.on{background:var(--gold);color:#0a111c}
.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down);box-shadow:0 0 12px var(--down)}
main{max-width:1240px;margin:0 auto;padding:10px 22px 30px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:linear-gradient(180deg,#0f1826,#0b121d);border:1px solid var(--line);border-radius:16px;padding:16px 16px 10px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sym{font-size:20px;font-weight:700;letter-spacing:.06em}
.price{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.chg{font-size:13px;font-weight:600;margin-top:2px}
.muted{color:var(--muted)}
.gauge{margin-top:12px}
.gauge-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{height:9px;border-radius:99px;background:#0a111c;border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--down),var(--gold),var(--up));border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.stat{background:#0a111c;border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center}
.stat b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.stat i{display:block;font-style:normal;color:var(--muted);font-size:10px;margin-top:2px}
.levels{margin-top:10px;font-size:12px;line-height:1.7}
.levels b{color:var(--gold);font-weight:600}
.sig{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px;line-height:1.7}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;margin:2px 4px 0 0}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tools button{background:#0a111c;border:1px solid var(--line);color:var(--muted);font-size:11px;padding:5px 9px;border-radius:8px;cursor:pointer}
.tools button.on{border-color:var(--gold);color:var(--gold)}
.chart-wrap{position:relative;margin-top:8px}
canvas.chart{width:100%;height:340px;display:block;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
.ohlc{position:absolute;left:8px;top:2px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;letter-spacing:.02em}
.ohlc b{color:var(--text);font-weight:600}
.hint{font-size:10px;color:var(--muted);margin-top:2px}
.events{max-width:1240px;margin:18px auto 0;padding:0 22px}
.events h2{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:0 0 10px}
.ev{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#0a111c;font-size:12px}
.ev .sev{font-weight:700;font-size:11px}
.ev .t{color:var(--muted);font-variant-numeric:tabular-nums}
footer{max-width:1240px;margin:0 auto;padding:18px 22px 40px;color:var(--muted);font-size:11px;line-height:1.7}
@media(max-width:900px){.grid{grid-template-columns:1fr}canvas.chart{height:300px}}
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">NAKED<span>-K</span> · 价格行为终端</div>
    <div class="sub">PRICE ACTION TERMINAL · CANDLES · PATTERNS · TRADINGVIEW-LIKE</div>
  </div>
  <div class="hright">
    <div class="tf" id="tf">
      <button data-tf="1h">1H</button><button data-tf="4h" class="on">4H</button><button data-tf="1d">1D</button>
    </div>
    <div class="live"><span class="dot"></span><span id="asof">加载中…</span></div>
  </div>
</header>
<main><div class="grid" id="grid"></div></main>
<section class="events"><h2>EVENT FEED · 1M/5M</h2><div id="events"></div></section>
<footer>分析工具，不构成投资建议。形态为规则候选，需结合上下文确认。滚轮缩放 · 拖拽平移 · 双击全屏 · 水平线/趋势线可画。</footer>
<script>
var TF='4h', DATA=null, CH={};
var C={up:'var(--up)',down:'var(--down)',neutral:'var(--muted)'};
function fmt(n,d){ if(n===null||n===undefined) return '—'; return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||2,maximumFractionDigits:d||2}); }
function pct(n){ return (n>=0?'+':'')+Number(n).toFixed(2)+'%'; }
function col(n){ return n>=0?C.up:C.down; }
function linesKey(sym){ return 'nk-lines-'+sym; }
function loadLines(sym){ try{return JSON.parse(localStorage.getItem(linesKey(sym))||'[]');}catch(e){return [];} }
function saveLines(sym,lines){ try{localStorage.setItem(linesKey(sym),JSON.stringify(lines));}catch(e){} fetch('/api/drawings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:sym,lines:lines})}).catch(function(){}); }
function drawChart(sym){
  var st=CH[sym]; if(!st||!st.s||!st.s.candles) return;
  var s=st.s,c=s.candles,n=c.length;
  var cv=document.querySelector('canvas.chart[data-sym="'+sym+'"]'); if(!cv) return;
  var dpr=window.devicePixelRatio||1,w=cv.clientWidth||600,h=cv.clientHeight||340;
  cv.width=w*dpr;cv.height=h*dpr;
  var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  var padL=8,padR=64,padT=26,volH=52,padB=24;
  var plotW=w-padL-padR,plotH=h-padT-padB-volH;
  st.plot={l:padL,r:w-padR,t:padT,b:h-padB-volH,w:plotW,h:plotH};
  var start=st.view.start,end=st.view.end,vis=c.slice(start,end),m=vis.length;
  if(!m)return;
  var lo=Math.min.apply(null,vis.map(function(x){return x.l;})),hi=Math.max.apply(null,vis.map(function(x){return x.h;}));
  if(s.r20_lo)lo=Math.min(lo,s.r20_lo); if(s.r20_hi)hi=Math.max(hi,s.r20_hi);
  (st.lines||[]).forEach(function(L){if(L.type==='hline'){lo=Math.min(lo,L.price);hi=Math.max(hi,L.price);}});
  var span=(hi-lo)||1,xw=plotW/m;
  function X(i){return padL+(i-start)*xw+xw/2;}
  function Y(p){return padT+(hi-p)/span*plotH;}
  function px(y){return hi-(y-padT)/plotH*span;}
  // grid + price axis
  ctx.strokeStyle='#162335';ctx.lineWidth=1;ctx.font='10px ui-monospace,Menlo';
  for(var g=0;g<=4;g++){
    var gy=padT+plotH*g/4;
    ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(padL+plotW,gy);ctx.stroke();
    ctx.fillStyle='#6f8199';ctx.fillText(fmt(hi-span*g/4,1),padL+plotW+4,gy+3);
  }
  // time axis
  ctx.strokeStyle='#162335';ctx.beginPath();ctx.moveTo(padL,h-padB);ctx.lineTo(padL+plotW,h-padB);ctx.stroke();
  ctx.fillStyle='#6f8199';
  for(var t=0;t<=4;t++){
    var idx=Math.min(m-1,Math.round((m-1)*t/4)),ct=c[start+idx];
    var tx=X(start+idx);
    var d=new Date(ct.t);
    var lab=TF==='1d'?(d.getMonth()+1)+'/'+d.getDate():(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':00';
    ctx.fillText(lab,Math.max(2,Math.min(tx-20,w-padR-36)),h-padB+14);
  }
  // volume
  if(st.showVol){
  var maxV=Math.max.apply(null,vis.map(function(x){return x.v;}))||1;
  for(var i=0;i<m;i++){
    var vh=vis[i].v/maxV*volH;
    ctx.fillStyle=vis[i].c>=vis[i].o?'rgba(255,91,110,.35)':'rgba(53,208,127,.35)';
    ctx.fillRect(X(start+i)-xw*0.32,h-padB-vh,xw*0.64,vh);
  }
  }
  // candles
  for(var i=0;i<m;i++){
    var ci=start+i,x=X(ci),up=vis[i].c>=vis[i].o;
    ctx.strokeStyle=up?'#ff5b6e':'#35d07f';ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath();ctx.moveTo(x,Y(vis[i].h));ctx.lineTo(x,Y(vis[i].l));ctx.stroke();
    var yO=Y(vis[i].o),yC=Y(vis[i].c),top=Math.min(yO,yC),bh=Math.max(1,Math.abs(yO-yC));
    ctx.fillRect(x-xw*0.32,top,xw*0.64,bh);
  }
  // EMA
  function poly(arr,color){
    if(!arr||arr.length<2)return;
    ctx.strokeStyle=color;ctx.lineWidth=1.3;ctx.beginPath();var first=true;
    for(var i=start;i<end;i++){
      var v=arr[i]; if(v===undefined)continue;
      var x=X(i),y=Y(v);
      if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  if(st.showEma){poly(s.ema20_series,'#d9b45b');poly(s.ema50_series,'#5aa9ff');}
  // levels
  function hline(p,color,label){
    if(!p)return;var y=Y(p);
    ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle=color;ctx.beginPath();
    ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();ctx.restore();
    ctx.fillStyle=color;ctx.font='9px ui-monospace,Menlo';ctx.fillText(label+' '+fmt(p,1),padL+2,y-3);
  }
  hline(s.r20_lo,'#35d07f','支撑');hline(s.r20_hi,'#ff5b6e','阻力');
  // swing marks
  var sm=s.swing_marks||{highs:[],lows:[]};
  ctx.font='9px ui-monospace,Menlo';
  (sm.highs||[]).forEach(function(pt){if(pt.i>=start&&pt.i<end){var x=X(pt.i),y=Y(pt.p);ctx.fillStyle='#ff5b6e';ctx.beginPath();ctx.arc(x,y,2.4,0,6.28);ctx.fill();ctx.fillText('SH',x+3,y-3);}});
  (sm.lows||[]).forEach(function(pt){if(pt.i>=start&&pt.i<end){var x=X(pt.i),y=Y(pt.p);ctx.fillStyle='#35d07f';ctx.beginPath();ctx.arc(x,y,2.4,0,6.28);ctx.fill();ctx.fillText('SL',x+3,y+9);}});
  // patterns
  (s.patterns||[]).forEach(function(pt){
    if(pt.role==='suppressed') return;
    if(pt.neckline){var y=Y(pt.neckline);ctx.save();ctx.setLineDash([2,4]);ctx.strokeStyle='rgba(217,180,91,.7)';ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();ctx.restore();}
    if(pt.index!=null&&pt.index>=start&&pt.index<end){
      var x=X(pt.index),y=Y(pt.price);
      ctx.fillStyle=pt.direction==='bullish'?'#35d07f':pt.direction==='bearish'?'#ff5b6e':'#d9b45b';
      ctx.font='9px ui-monospace,Menlo';ctx.fillText(pt.type,x+3,y-6);
    }
  });
  // user drawings
  (st.lines||[]).forEach(function(L){
    ctx.save();ctx.strokeStyle='#e8eef8';ctx.lineWidth=1.2;
    if(L.type==='hline'){var y=Y(L.price);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();ctx.fillStyle='#e8eef8';ctx.font='9px ui-monospace,Menlo';ctx.fillText(fmt(L.price,1),padL+plotW+4,y+3);}
    if(L.type==='trend'&&L.p1&&L.p2){ctx.beginPath();ctx.moveTo(X(L.p1.i),Y(L.p1.price));ctx.lineTo(X(L.p2.i),Y(L.p2.price));ctx.stroke();}
    ctx.restore();
  });
  // crosshair
  if(st.hover>=start&&st.hover<end){
    var hx=X(st.hover),cy=st.hoverY||padT;
    ctx.save();ctx.setLineDash([3,3]);ctx.strokeStyle='#8b9bb4';
    ctx.beginPath();ctx.moveTo(hx,padT);ctx.lineTo(hx,h-padB);ctx.stroke();
    if(st.hoverY){ctx.beginPath();ctx.moveTo(padL,cy);ctx.lineTo(padL+plotW,cy);ctx.stroke();}
    ctx.restore();
    ctx.fillStyle='#0a111c';ctx.strokeStyle='#8b9bb4';
    var pl=fmt(Y?px(cy):0,1);
    ctx.fillRect(padL+plotW+1,cy-8,padR-2,16);ctx.strokeRect(padL+plotW+1,cy-8,padR-2,16);
    ctx.fillStyle='#e8eef8';ctx.font='10px ui-monospace,Menlo';ctx.fillText(pl,padL+plotW+4,cy+3);
  }
  // legend
  var ci=(st.hover>=0&&st.hover<n)?st.hover:n-1;
  var cc=c[ci],chg=cc.o?((cc.c-cc.o)/cc.o*100):0;
  var el=document.getElementById('ohlc-'+sym);
  if(el) el.innerHTML='<b>'+sym.replace('USDT','')+'</b> · '+TF+'  O '+fmt(cc.o,1)+'  H '+fmt(cc.h,1)+'  L '+fmt(cc.l,1)+'  C '+fmt(cc.c,1)+'  <span style="color:'+col(chg)+'">'+pct(chg)+'</span>  VOL '+fmt(cc.v,0);
}
function setView(sym,start,end){var st=CH[sym];if(!st)return;var n=st.s.candles.length;var cnt=Math.max(20,Math.min(n,end-start));start=Math.max(0,Math.min(n-cnt,start));st.view={start:start,end:start+cnt};drawChart(sym);}
function bind(sym){
  var st=CH[sym],cv=document.querySelector('canvas.chart[data-sym="'+sym+'"]');
  if(!cv)return;
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=cv.getBoundingClientRect(),x=e.clientX-r.left;
    var p=st.plot||{l:8,w:r.width-72};var ratio=Math.max(0,Math.min(1,(x-p.l)/p.w));
    var cnt=st.view.end-st.view.start,newCnt=Math.round(cnt*(e.deltaY>0?1.15:0.87));
    newCnt=Math.max(20,Math.min(st.s.candles.length,newCnt));
    var center=st.view.start+ratio*cnt,ns=Math.round(center-ratio*newCnt);
    setView(sym,ns,ns+newCnt);
  },{passive:false});
  var drag=null;
  cv.addEventListener('mousedown',function(e){
    if(st.mode==='none'){drag={x:e.clientX,view:Object.assign({},st.view)};}
  });
  window.addEventListener('mouseup',function(){drag=null;});
  cv.addEventListener('mousemove',function(e){
    var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(drag){
      var p=st.plot,d=(drag.x-e.clientX)/p.w*(drag.view.end-drag.view.start);
      setView(sym,drag.view.start+Math.round(d),drag.view.end+Math.round(d));
      return;
    }
    var p=st.plot||{l:8,w:r.width-72};
    var ratio=Math.max(0,Math.min(1,(x-p.l)/p.w));
    st.hover=Math.min(st.s.candles.length-1,st.view.start+Math.floor(ratio*(st.view.end-st.view.start)));
    st.hoverY=y;
    if(!st.raf){st.raf=true;requestAnimationFrame(function(){st.raf=false;drawChart(sym);});}
  });
  cv.addEventListener('mouseleave',function(){st.hover=-1;st.hoverY=null;drawChart(sym);});
  cv.addEventListener('click',function(e){
    if(st.mode==='none')return;
    var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    var p=st.plot;var ratio=Math.max(0,Math.min(1,(x-p.l)/p.w));
    var idx=st.view.start+Math.floor(ratio*(st.view.end-st.view.start));
    var price=null;
    if(p&&p.h){var lo=Math.min.apply(null,st.s.candles.slice(st.view.start,st.view.end).map(function(z){return z.l;}));var hi=Math.max.apply(null,st.s.candles.slice(st.view.start,st.view.end).map(function(z){return z.h;}));price=hi-(y-p.t)/p.h*(hi-lo);}
    if(st.mode==='hline'&&price){st.lines.push({type:'hline',price:price});saveLines(sym,st.lines);st.mode='none';syncTools(sym);drawChart(sym);}
    if(st.mode==='trend'&&price){
      if(!st.p1){st.p1={i:idx,price:price};}
      else{st.lines.push({type:'trend',p1:st.p1,p2:{i:idx,price:price}});st.p1=null;saveLines(sym,st.lines);st.mode='none';syncTools(sym);drawChart(sym);}
    }
  });
  var tch=null;
  function mid(t){return (t[0].clientX+t[1].clientX)/2;}
  function tdist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy)||1;}
  cv.addEventListener('touchstart',function(e){
    var r=cv.getBoundingClientRect();
    if(e.touches.length===2){tch={mode:'pinch',d:tdist(e.touches),view:Object.assign({},st.view),x:mid(e.touches)-r.left};e.preventDefault();}
    else if(e.touches.length===1){tch={mode:'pan',x:e.touches[0].clientX,view:Object.assign({},st.view),moved:0};}
  },{passive:false});
  cv.addEventListener('touchmove',function(e){
    if(!tch)return;e.preventDefault();
    var r=cv.getBoundingClientRect();
    if(tch.mode==='pinch'&&e.touches.length===2){
      var pp=st.plot||{l:8,w:r.width-72};
      var ratio=tch.d/tdist(e.touches);
      var cnt=tch.view.end-tch.view.start,newCnt=Math.max(20,Math.min(st.s.candles.length,Math.round(cnt*ratio)));
      var rr=Math.max(0,Math.min(1,(tch.x-pp.l)/pp.w));
      var center=tch.view.start+rr*cnt,ns=Math.round(center-rr*newCnt);
      setView(sym,ns,ns+newCnt);
      return;
    }
    if(tch.mode==='pan'&&e.touches.length===1){
      var pl=st.plot,d0=(tch.x-e.touches[0].clientX)/pl.w*(tch.view.end-tch.view.start);
      tch.moved=Math.max(tch.moved,Math.abs(e.touches[0].clientX-tch.x));
      setView(sym,tch.view.start+Math.round(d0),tch.view.end+Math.round(d0));
    }
  },{passive:false});
  cv.addEventListener('touchend',function(e){
    if(tch&&tch.mode==='pan'&&tch.moved<8&&e.touches.length===0){
      var r2=cv.getBoundingClientRect(),x2=tch.x-r2.left;
      var p2=st.plot||{l:8,w:r2.width-72};
      var ra=Math.max(0,Math.min(1,(x2-p2.l)/p2.w));
      st.hover=Math.min(st.s.candles.length-1,st.view.start+Math.floor(ra*(st.view.end-st.view.start)));
      st.hoverY=null;drawChart(sym);
    }
    if(e.touches.length===0){tch=null;}
    else if(e.touches.length===1&&tch){tch={mode:'pan',x:e.touches[0].clientX,view:Object.assign({},st.view),moved:0};}
  },{passive:false});
  cv.addEventListener('dblclick',function(){var card=cv.closest('.card');if(card&&card.requestFullscreen)card.requestFullscreen();});
}
function syncTools(sym){
  var card=document.querySelector('canvas.chart[data-sym="'+sym+'"]');
  if(!card)return;var st=CH[sym];
  card.closest('.card').querySelectorAll('[data-mode]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-mode')===st.mode);});
}
function card(sym,s){
  var tr=s.trend||{},st=s.stance||{},dir=st.direction||'neutral';
  var sc=tr.score||50,label=tr.label||'neutral',ai=tr.always_in||'neutral';
  function pstate(t,d){var a=s.pattern_states||[];for(var i=0;i<a.length;i++){if(a[i].type===t&&a[i].direction===d)return a[i].status;}return '';}var prim=s.primary_pattern,sec=s.secondary_pattern;var pats='';if(prim){var c=prim.direction==='bullish'?'var(--up)':prim.direction==='bearish'?'var(--down)':'var(--gold)';var pst=pstate(prim.type,prim.direction);pats+='<span class="pill" style="color:'+c+';border:1px solid '+c+'">主：'+prim.label+' · '+prim.quality+(pst?' · '+pst:'')+'</span>';}if(sec){var c2=sec.direction==='bullish'?'var(--up)':sec.direction==='bearish'?'var(--down)':'var(--gold)';var sst=pstate(sec.type,sec.direction);pats+='<span class="pill" style="color:'+c2+';border:1px solid '+c2+'">备：'+sec.label+' · '+sec.quality+(sst?' · '+sst:'')+'</span>';}var sup=(s.patterns||[]).filter(function(x){return x.role==='suppressed';}).length;if(!prim)pats='<span class="muted" style="font-size:11px">无标准形态</span>';pats+='<span class="muted" style="font-size:10px"> · 上下文 '+(s.pattern_context||'—')+' · 过滤 '+sup+' 个</span>';
  var sig='方向 <span class="pill" style="color:'+C[dir]+';border:1px solid '+C[dir]+'">'+dir+'</span> · 置信度 <b>'+(st.confidence||'—')+'</b>';
  if(st.entry)sig+=' · entry <b>'+fmt(st.entry,1)+'</b> · stop <b>'+fmt(st.stop,1)+'</b> · target <b>'+fmt(st.target,1)+'</b>';
  return '<article class="card">'
    +'<div class="card-top"><div><div class="sym">'+sym.replace('USDT','')+'<span class="muted" style="font-size:12px">/USDT</span></div>'
    +'<div class="price">'+fmt(s.price,2)+'</div>'
    +'<div class="chg" style="color:'+col(s.change24h)+'">'+pct(s.change24h)+' · 24h 高/低 '+fmt(s.high24h,1)+' / '+fmt(s.low24h,1)+'</div></div>'
    +'<div style="text-align:right"><div class="muted" style="font-size:11px">TREND SCORE</div>'
    +'<div style="font-size:26px;font-weight:700;color:'+(sc>=60?C.up:sc<=40?C.down:C.neutral)+'">'+sc+'</div>'
    +'<div class="muted" style="font-size:11px">'+label+'</div></div></div>'
    +'<div class="gauge"><div class="gauge-head"><span>Always-In: <b style="color:'+C[ai]+'">'+ai+'</b></span><span>0 — 100</span></div><div class="bar"><div class="fill" style="width:'+sc+'%"></div></div></div>'
    +'<div class="stats"><div class="stat"><b>'+fmt(s.adx,1)+'</b><i>ADX</i></div><div class="stat"><b>'+fmt(s.rsi,1)+'</b><i>RSI</i></div><div class="stat"><b>'+fmt(s.atr_pct,2)+'%</b><i>ATR</i></div><div class="stat"><b>'+fmt(s.vol_z,2)+'</b><i>VOL Z</i></div><div class="stat"><b>'+Math.round((s.pos20||0)*100)+'%</b><i>POS20</i></div></div>'
    +'<div class="levels">支撑 <b>'+fmt(s.r20_lo,1)+'</b> / '+fmt((s.swing_lows||[]).slice(-1)[0]||s.low24h,1)+' · 阻力 <b>'+fmt(s.r20_hi,1)+'</b> / '+fmt((s.swing_highs||[]).slice(-1)[0]||s.high24h,1)+'</div>'
    +'<div class="sig">'+sig+'</div>'
    +'<div style="margin-top:7px;font-size:11px;color:var(--muted)">结构：'+(s.structure||'—')+' · 形态：'+pats+'</div>'
    +'<div class="tools"><button data-ind="ema" class="on">EMA</button><button data-ind="vol" class="on">VOL</button><button data-mode="hline">水平线</button><button data-mode="trend">趋势线</button><button data-mode="clear">清除画线</button><button data-full="1">全屏</button></div>'
    +'<div class="chart-wrap"><div class="ohlc" id="ohlc-'+sym+'"></div><canvas class="chart" data-sym="'+sym+'"></canvas></div>'
    +'<div class="hint">滚轮缩放 · 拖拽平移 · 双击全屏 · 十字线 OHLC</div>'
    +'</article>';
}
function render(){
  if(!DATA)return;
  var g=document.getElementById('grid');var keys=Object.keys(DATA.symbols||{});
  g.innerHTML=keys.map(function(k){return card(k,DATA.symbols[k]);}).join('');
  keys.forEach(function(sym){
    var s=DATA.symbols[sym],n=s.candles.length;
    CH[sym]={s:s,view:{start:Math.max(0,n-80),end:n},hover:-1,hoverY:null,mode:'none',p1:null,lines:loadLines(sym),showEma:true,showVol:true};
    bind(sym);drawChart(sym);
    fetch('/api/drawings?symbol='+sym).then(function(r){return r.json();}).then(function(lines){if(lines&&lines.length){CH[sym].lines=lines;drawChart(sym);}}).catch(function(){});
    var root=document.querySelector('canvas.chart[data-sym="'+sym+'"]').closest('.card');
    root.querySelectorAll('[data-mode]').forEach(function(b){
      b.addEventListener('click',function(){
        var m=b.getAttribute('data-mode');
        if(m==='clear'){CH[sym].lines=[];saveLines(sym,[]);CH[sym].mode='none';syncTools(sym);drawChart(sym);return;}
        CH[sym].mode=(CH[sym].mode===m?'none':m);CH[sym].p1=null;syncTools(sym);
      });
    });
    root.querySelectorAll('[data-ind]').forEach(function(b){
      b.addEventListener('click',function(){
        var k=b.getAttribute('data-ind');
        if(k==='ema')CH[sym].showEma=!CH[sym].showEma;
        if(k==='vol')CH[sym].showVol=!CH[sym].showVol;
        b.classList.toggle('on',k==='ema'?CH[sym].showEma:CH[sym].showVol);
        drawChart(sym);
      });
    });
    root.querySelector('[data-full]').addEventListener('click',function(){if(root.requestFullscreen)root.requestFullscreen();});
  });
  var first=Object.keys(DATA.symbols||{})[0];var dts=first?DATA.symbols[first].data_ts:DATA.as_of;
  document.getElementById('asof').textContent='数据 '+new Date(dts).toLocaleString('zh-CN',{hour12:false})+' · Binance · '+TF;
  var ev=document.getElementById('events');
  ev.innerHTML=(DATA.events||[]).map(function(e){
    var t=new Date(e.ts).toLocaleString('zh-CN',{hour12:false});
    var c=e.severity==='P0'?'var(--up)':e.severity==='P1'?'var(--amber)':'var(--muted)';
    return '<div class="ev"><span class="sev" style="color:'+c+'">'+e.severity+'</span><span class="t">'+t+'</span><span>'+e.symbol+' · '+e.kind+'</span><span class="muted">'+fmt(e.price,1)+'</span></div>';
  }).join('')||'<div class="ev muted">暂无事件</div>';
}
async function load(tf){
  TF=tf;document.querySelectorAll('#tf button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tf')===tf);});
  try{var r=await fetch('/api/overview?interval='+tf);DATA=await r.json();render();}
  catch(e){document.getElementById('asof').textContent='数据源异常';}
}
window.addEventListener('resize',function(){Object.keys(CH).forEach(function(k){drawChart(k);});});
document.querySelectorAll('#tf button').forEach(function(b){b.addEventListener('click',function(){load(b.getAttribute('data-tf'));});});
load('4h');setInterval(function(){load(TF);},60000);
</script>
</body>
</html>

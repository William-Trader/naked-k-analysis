name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Syntax gate
        run: python -m compileall -q nakedk pa_fetch.py

      - name: Dashboard JS syntax
        run: |
          python - <<'PY'
          import re
          s = open('dashboard/index.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          open('/tmp/dash.js', 'w', encoding='utf-8').write(m.group(1) if m else '')
          PY
          node --check /tmp/dash.js
